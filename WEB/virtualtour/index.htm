    <script>
        /* ============================================================
           POLYFILL untuk DeviceMotionEvent / DeviceOrientationEvent
           ============================================================
           Chrome Android & beberapa browser memblokir API ini di
           non-secure context (HTTP). 3DVista player crash saat
           referensi API ini hilang. Kita buat stub minimal supaya
           tour bisa load. Gyroscope tidak aktif, tapi panorama
           tetap berjalan via touch / drag.
           ============================================================ */
        if (typeof DeviceMotionEvent === 'undefined') {
            window.DeviceMotionEvent = function DeviceMotionEvent(){};
            window.DeviceMotionEvent.requestPermission = function(){
                return Promise.resolve('denied');
            };
        }
        if (typeof DeviceOrientationEvent === 'undefined') {
            window.DeviceOrientationEvent = function DeviceOrientationEvent(){};
            window.DeviceOrientationEvent.requestPermission = function(){
                return Promise.resolve('denied');
            };
        }

    <script src="lib/tdvplayer.js?v=1779390484065"></script>
    <script type="text/javascript">
        if(location.search.indexOf('preview=1') !== -1)
            document.documentElement.className += ' tour-preview';

        var player;
        var playersPlayingTmp = [];
        var isInitialized = false;
        var isPaused = false;

        /* Inisialisasi player TDV: bikin instance, pasang listener
           preloadMediaShow & stateChange, parse query (media-index/
           media-name) untuk navigasi langsung ke panorama tertentu. */
        function loadTour()
        {
            if(player)
                return;

            var beginFunc = function(event){
                if(event.name == 'begin')
                {
                    var camera = event.data.source.get('camera');
                    if(camera && camera.get('initialSequence') && camera.get('initialSequence').get('movements').length > 0)
                        return;
                }

                if(event.sourceClassName == "MediaAudio")
                    return;

                isInitialized = true;

                player.unbind('preloadMediaShow', beginFunc, player, true);
                player.unbindOnObjectsOf('PanoramaPlayListItem', 'begin', beginFunc, player, true);
                player.unbind('stateChange', beginFunc, player, true);
                window.parent.postMessage("tourLoaded", '*');

                disposePreloader();

                onVirtualTourLoaded();
            };

            var settings = new TDV.PlayerSettings();
            
            settings.set(TDV.PlayerSettings.CONTAINER, document.getElementById('viewer'));
            settings.set(TDV.PlayerSettings.SCRIPT_URL, 'script.js?v=1779390484070');
            settings.set(TDV.PlayerSettings.WEBVR_POLYFILL_URL, 'lib/WebVRPolyfill.js?v=1779390484065');
            settings.set(TDV.PlayerSettings.HLS_URL, 'lib/Hls.js?v=1779390484065');
            settings.set(TDV.PlayerSettings.QUERY_STRING_PARAMETERS, 'v=1779390484065');
            window.tdvplayer = player = TDV.PlayerAPI.create(settings);
            player.bind('preloadMediaShow', beginFunc, player, true);
            player.bind('stateChange', beginFunc, player, true);
            player.bindOnObjectsOf('PanoramaPlayListItem', 'begin', beginFunc, player, true);
            player.bindOnObject('rootPlayer', 'start', function(e){
                var queryDict = {}; location.search.substr(1).split("&").forEach(function(item) {var k = item.split("=")[0], v = decodeURIComponent(item.split("=")[1]);queryDict[k] = v});
                var item = undefined;
                if("media-index" in queryDict){
                    item = setMediaByIndex(parseInt(queryDict["media-index"]) - 1);
                }
                else if("media-name" in queryDict){
                    item = setMediaByName(queryDict["media-name"]);
                }
                else{
                    item = setMediaByIndex(0);
                }
                if(item != undefined && "trigger-overlay-name" in queryDict){
                    triggerOverlayByName(item, queryDict["trigger-overlay-name"], "trigger-overlay-event" in queryDict ? queryDict["trigger-overlay-event"] : "click");
                }

                player.getById('rootPlayer').bind('tourEnded', function(){
                    onVirtualTourEnded();
                }, player, true);
            }, player, false);

            /* Listen messages */
            window.addEventListener('message', function (e) {
                //Listen to messages for make actions to player in the format function:param1,param2
                var action = e.data;
                if (action == 'pauseTour' || action == 'resumeTour') {
                    this[action].apply(this);
                }
            });
        }

        /* Pause semua media player aktif (panorama, video, audio).
           Dipanggil dari parent window via postMessage 'pauseTour'. */
        function pauseTour()
        {
            isPaused = true;
            if(!isInitialized)
                return;

            var playLists = player.getByClassName('PlayList');
            for(var i = 0, count = playLists.length; i<count; i++)
            {
                var playList = playLists[i];
                var index = playList.get('selectedIndex');
                if(index != -1)
                {
                    var item = playList.get('items')[index];
                    var itemPlayer = item.get('player');
                    if(itemPlayer && itemPlayer.pause)
                    {
                        playersPlayingTmp.push(itemPlayer);
                        itemPlayer.pause();
                    }
                }
            }

            player.getById('pauseGlobalAudios')();
        }

        /* Resume semua player yang sebelumnya di-pause oleh pauseTour(). */
        function resumeTour()
        {
            isPaused = false;
            if(!isInitialized)
                return;

            while(playersPlayingTmp.length)
            {
                var viewer = playersPlayingTmp.pop();
                viewer.play();
            }

            player.getById('resumeGlobalAudios')();
        }

        /* Callback saat tour selesai inisialisasi. Kalau sebelumnya
           pause request datang sebelum siap, eksekusi sekarang. */
        function onVirtualTourLoaded()
        {
            if(isPaused)
                pauseTour();
        }

        /* Callback saat tour mencapai akhir playlist. Hook untuk
           extension custom; default kosong. */
        function onVirtualTourEnded()
        {

        }

        /* Helper: ambil rootPlayer instance kalau tdvplayer sudah ada. */
        function getRootPlayer()
        {
            return window.tdvplayer !== undefined ? window.tdvplayer.getById('rootPlayer') : undefined;
        }

        /* Pindah ke panorama tertentu via index playlist (0-based).
           Dipakai saat URL punya ?media-index=N. */
        function setMediaByIndex(index)
        {
            var rootPlayer = getRootPlayer();
            if(rootPlayer !== undefined) {
                return rootPlayer.setMainMediaByIndex(index);
            }
        }

        /* Pindah ke panorama via nama (case-sensitive label).
           Dipakai saat URL punya ?media-name=Foo. */
        function setMediaByName(name)
        {
            var rootPlayer = getRootPlayer();
            if(rootPlayer !== undefined) {
                return rootPlayer.setMainMediaByName(name);
            }
        }

        /* Trigger event (default 'click') ke overlay tertentu setelah
           panorama mulai render. Dipakai untuk auto-buka popup saat
           deep-link via ?trigger-overlay-name=Foo. */
        function triggerOverlayByName(item, name, eventName)
        {
            var rootPlayer = getRootPlayer();
            if(rootPlayer !== undefined) {
                item.bind('begin', function(e){
                    item.unbind('begin', arguments.callee, this);
                    var overlay = rootPlayer.getPanoramaOverlayByName(item.get('media'), name);
                    if(overlay)
                        rootPlayer.triggerOverlay(overlay, eventName);
                }, rootPlayer);
            }
        }

        /* Tampilkan splash preloader (background putih + teks "Loading..."). */
        function showPreloader()
        {
            var preloadContainer = document.getElementById('preloadContainer');
            if(preloadContainer != undefined)
                preloadContainer.style.opacity = 1;
        }

        /* Sembunyikan preloader dengan transisi fade-out. Force-hide
           via setTimeout sebagai fallback kalau transitionend tidak fire. */
        function disposePreloader()
        {
            var preloadContainer = document.getElementById('preloadContainer');
            if(preloadContainer == undefined)
                return;

            var transitionEndName = transitionEndEventName();
            if(transitionEndName)
            {
                preloadContainer.addEventListener(transitionEndName, hide, false);
                preloadContainer.style.opacity = 0;
                setTimeout(hide, 500); //Force hide. Some cases the transitionend event isn't dispatched with an iFrame.
            }
            else
            {
                hide();
            }

            function hide()
            {
                
                preloadContainer.style.visibility = 'hidden';
                preloadContainer.style.display = 'none';
            }

            function transitionEndEventName () {
                var el = document.createElement('div');
                var transitions = {
                        'transition':'transitionend',
                        'OTransition':'otransitionend',
                        'MozTransition':'transitionend',
                        'WebkitTransition':'webkitTransitionEnd'
                    };

                var t;
                for (t in transitions) {
                    if (el.style[t] !== undefined) {
                        return transitions[t];
                    }
                }

                return undefined;
            }
        }

        /* Body click handler -- legacy fallback untuk browser yg butuh
           user gesture sebelum load tour. Tidak aktif di flow normal. */
        function onBodyClick(){
            document.body.removeEventListener("click", onBodyClick);
            document.body.removeEventListener("touchend", onBodyClick);
            loadTour();
        }

        /* Entry point dari body onload: handle iOS WebKit viewport scaling
           workaround, lalu show preloader & loadTour(). */
        function onLoad() {
            if (/AppleWebKit/.test(navigator.userAgent) && /Mobile\/\w+/.test(navigator.userAgent))
            {
                var inIFrame = false;
                try
                {
                    inIFrame = (window.self !== window.top);
                }
                catch (e)
                {
                    inIFrame = true;
                }
                if (!inIFrame)
                {
                    var onResize = function(async)
                    {
                        [0, 250, 1000, 2000].forEach(function(delay)
                        {
                            setTimeout(function()
                            {
                                var viewer = document.querySelector('#viewer');
                                var scale = window.innerWidth / document.documentElement.clientWidth;
                                var width = document.documentElement.clientWidth;
                                var height = Math.round(window.innerHeight / scale);
                                viewer.style.width = width + 'px';
                                viewer.style.height = height + 'px';
                                viewer.style.left = Math.round((window.innerWidth - width) * 0.5) + 'px';
                                viewer.style.top = Math.round((window.innerHeight - height) * 0.5) + 'px';
                                viewer.style.transform = 'scale(' + scale + ', ' + scale + ')';
                                window.scrollTo(0,0);
                            }, delay);
                        });
                    };
                    window.addEventListener('resize', onResize);
                    onResize();
                }
            }


            if (isOVRWeb()){
                showPreloader();
                loadTour();
                return;
            }

            showPreloader();
loadTour()
        }

        /* Putar video dengan fallback untuk Safari desktop (autoplay policy).
           Kalau gagal autoplay, mute video & detect klik user untuk play. */
        function playVideo(video) {
            /* Helper: deteksi Safari desktop versi 11+ yg butuh
               muted-autoplay khusus. */
            function isSafariDesktopV11orGreater() {
                return /^((?!chrome|android|crios|ipad|iphone).)*safari/i.test(navigator.userAgent) && parseFloat(/Version\/([0-9]+\.[0-9]+)/i.exec(navigator.userAgent)[1]) >= 11;
            }

            /* Listener: pertama kali user klik/touch video, unmute & play. */
            function detectUserAction() {
                var onVideoClick = function(e) {
                    if(video.paused) {
                        video.play();
                    }
                    video.muted = false;
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    e.preventDefault();
                    video.removeEventListener('click', onVideoClick);
                    video.removeEventListener('touchend', onVideoClick);
                };
                video.addEventListener("click", onVideoClick);
                video.addEventListener("touchend", onVideoClick);
            }

            if (isSafariDesktopV11orGreater()) {
                video.muted = true;
                video.play();
            } else {
                var canPlay = true;
                var promise = video.play();
                if (promise) {
                    promise.catch(function() {
                        video.muted = true;
                        video.play();
                        detectUserAction();
                    });
                } else {
                    canPlay = false;
                }

                if (!canPlay || video.muted) {
                    detectUserAction();
                }
            }
        }

        /* Deteksi mode Oculus VR Web (URL hash mengandung 'ovrweb'). */
        function isOVRWeb(){
            return window.location.hash.substring(1).split('&').indexOf('ovrweb') > -1;
        }

    <script>
        /* ============================================================
           RESPONSIVE ENFORCER UNTUK MOBILE
           ============================================================
           Player TDV memakai inline style untuk semua container.
           CSS !important kadang menang, tapi player TDV juga
           menulis ulang style saat resize / orientation change.
           Solusi: pakai TDV Player API setProperty pada komponen
           agar perubahan persisten.
           ============================================================ */
        (function(){
            /* Helper viewport size check. */
            function isMobile(){ return window.innerWidth <= 768; }
            function isSmall(){ return window.innerWidth <= 420; }

            /* Komponen yang perlu disesuaikan ukurannya di mobile.
               Setiap entry: [id, propertyOverrides]
               
               Pendekatan: pakai TDV Player API untuk set width + left.
               Player akan otomatis re-distribute children (tombol-tombol
               di dalam panel) agar terdistribusi rata di lebar baru. */
            /* Generate list properti TDV component yg perlu di-override
               di mobile. Return null kalau di desktop (>768px) -> trigger
               applyDesktopDefaults. */
            function getMobileOverrides(){
                var w = window.innerWidth;
                if(w > 768) return null;

                var ctrlW = Math.min(360, Math.round(w * 0.96));

                return [
                    {
                        /* Panel kontrol bawah -- override width supaya
                           player TDV menghitung ulang posisi children agar
                           terdistribusi rata di lebar baru. */
                        id: 'Container_3F72EA07_2713_E8A1_41C0_5D817AC45A95',
                        props: {
                            width:  ctrlW,
                            right:  null,
                            left:   Math.round((w - ctrlW) / 2),
                            bottom: 16,
                            top:    null
                        }
                    }
                ];
            }

            /* Original values dari script.js -- untuk reset saat dari mobile -> desktop.
               Di desktop, kita pakai CSS saja untuk centering (left:50% + translateX). */
            var DESKTOP_DEFAULTS = {
                'Container_3F72EA07_2713_E8A1_41C0_5D817AC45A95': {
                    width:  361.9,
                    height: 121.65,
                    right:  null,    /* CSS yg handle centering */
                    left:   null,    /* biarkan CSS pakai 50% */
                    bottom: '4.2%',
                    top:    null
                }
            };

            /* Reset properti komponen ke nilai default desktop & bersihkan
               inline style sisa mobile (left/right/transform) supaya CSS
               @media yg center via left:50% bisa take over. */
            function applyDesktopDefaults(){
                if(!window.tdvplayer || !window.tdvplayer.getById) return;
                Object.keys(DESKTOP_DEFAULTS).forEach(function(id){
                    try {
                        var comp = window.tdvplayer.getById(id);
                        if(!comp || !comp.set) return;
                        var props = DESKTOP_DEFAULTS[id];
                        Object.keys(props).forEach(function(k){
                            try { comp.set(k, props[k]); } catch(e){}
                        });
                    } catch(e){}
                });

                /* PENTING: TDV API `comp.set('left', null)` tidak selalu
                   menghapus inline `style.left` di DOM. Saat transisi
                   mobile->desktop, inline `left: <px>` peninggalan mobile
                   masih ada -> panel terlihat di kiri-bawah meskipun CSS
                   @media punya `left:50% !important`.
                   Solusi: hapus langsung inline left/right/transform agar
                   CSS @media take over. */
                var panel = document.getElementById('Container_3F72EA07_2713_E8A1_41C0_5D817AC45A95');
                if(panel){
                    panel.style.removeProperty('left');
                    panel.style.removeProperty('right');
                    panel.style.removeProperty('transform');
                }

                /* Pastikan tombol toggle denah visible (di kiri-atas) */
                try {
                    var btn = window.tdvplayer.getById('Image_45E0EBBC_4BCC_8DAB_41D1_1835FA1540D4');
                    if(btn && btn.set) btn.set('visible', true);
                } catch(e){}
            }

            /* Apply mobile overrides ke TDV (set width + left). Bersihkan
               dulu inline style desktop enforcer supaya TDV API bisa menang. */
            function applyMobileOverrides(){
                if(!window.tdvplayer || !window.tdvplayer.getById) return false;
                var overrides = getMobileOverrides();
                if(!overrides){
                    /* Desktop: reset ke nilai default agar tombol tidak rusak
                       setelah pernah ke mobile */
                    applyDesktopDefaults();
                    return true;
                }

                /* Bersihkan inline style yg mungkin ditulis enforcer desktop
                   (left:50%, transform:translateX(-50%) dengan !important).
                   Jika tidak dibersihkan, mobile TDV API set('left', px) tetap
                   kalah karena inline desktop punya !important. */
                var panel = document.getElementById('Container_3F72EA07_2713_E8A1_41C0_5D817AC45A95');
                if(panel){
                    panel.style.removeProperty('left');
                    panel.style.removeProperty('right');
                    panel.style.removeProperty('transform');
                    panel.style.removeProperty('transform-origin');
                }

                var anyApplied = false;
                overrides.forEach(function(o){
                    try {
                        var comp = window.tdvplayer.getById(o.id);
                        if(!comp || !comp.set) return;
                        Object.keys(o.props).forEach(function(k){
                            try { comp.set(k, o.props[k]); } catch(e){}
                        });
                        anyApplied = true;
                    } catch(e){}
                });

                return anyApplied;
            }

            /* Apply mobile overrides on tour load + retry interval untuk
               catch komponen yg ter-render telat oleh TDV. */
            function startEnforcer(){
                applyMobileOverrides();
                var tries = 0;
                var timer = setInterval(function(){
                    applyMobileOverrides();
                    if(++tries > 20) clearInterval(timer);
                }, 250);
            }

            window.addEventListener('tourLoaded', startEnforcer);
            window.addEventListener('message', function(e){
                if(e && e.data === 'tourLoaded') startEnforcer();
            });
            /* Fallback: jalankan setelah delay (player umumnya siap < 5s) */
            setTimeout(startEnforcer, 1500);
            setTimeout(startEnforcer, 4000);
            setTimeout(startEnforcer, 8000);

            window.addEventListener('resize', function(){
                /* Debounce */
                clearTimeout(window.__respEnforceT);
                window.__respEnforceT = setTimeout(applyMobileOverrides, 200);
            });
            window.addEventListener('orientationchange', function(){
                setTimeout(applyMobileOverrides, 400);
            });

            /* ============================================================
               PERBAIKAN HFOV PANORAMA DI MOBILE (anti-fisheye / lensa 0.5)
               ============================================================
               Default player TDV menyesuaikan HFOV otomatis berdasarkan
               aspect ratio viewer. Di HP portrait, viewer punya aspect
               ratio sempit (tinggi), sehingga HFOV menjadi sangat lebar
               (~120-140°) yang menimbulkan efek fisheye distorsi seperti
               lensa 0.5 ultrawide.

               Approach: kunci HFOV ke 70° (sama dengan default desktop).
               Player akan memotong panorama horizontal, lalu pengguna
               masih bisa drag untuk melihat sekeliling 360°.
               ============================================================ */
            /* Kunci HFOV panorama ke 70° di mobile portrait untuk hindari
               efek fisheye distorsi (default TDV auto-stretch HFOV jadi
               120-140° di aspect ratio sempit). */
            function clampPanoramaFov(){
                if(!window.tdvplayer || !window.tdvplayer.getById) return;
                var w = window.innerWidth;
                if(w > 768) return; /* desktop: biarkan default */

                var targetHfov = 70; /* HFOV natural seperti desktop */

                try {
                    /* 1. Set di SEMUA PanoramaCameraPosition (initialPosition tiap camera).
                          Ini akan dipakai sebagai HFOV awal ketika panorama berikutnya dimuat. */
                    var positions = window.tdvplayer.getByClassName('PanoramaCameraPosition');
                    if(positions){
                        positions.forEach(function(pos){
                            try { pos.set('hfov', targetHfov); } catch(e){}
                        });
                    }

                    /* 2. Set langsung di player aktif (untuk panorama yang sedang ditampilkan). */
                    var panoPlayer = window.tdvplayer.getById('MainViewerPanoramaPlayer');
                    if(panoPlayer){
                        try { panoPlayer.set('hfov', targetHfov); } catch(e){}
                        try { panoPlayer.set('maxHfov', 90); } catch(e){}
                        try { panoPlayer.set('minHfov', 30); } catch(e){}
                    }

                    /* 3. Set di SEMUA PanoramaPlayer aktif (jika ada multi-viewer). */
                    var players = window.tdvplayer.getByClassName('PanoramaPlayer');
                    if(players){
                        players.forEach(function(p){
                            try { p.set('hfov', targetHfov); } catch(e){}
                            try { p.set('maxHfov', 90); } catch(e){}
                        });
                    }
                } catch(e){}
            }

            window.addEventListener('tourLoaded', clampPanoramaFov);
            window.addEventListener('message', function(e){
                if(e && e.data === 'tourLoaded') setTimeout(clampPanoramaFov, 200);
            });
            setTimeout(clampPanoramaFov, 2000);
            setTimeout(clampPanoramaFov, 5000);
            window.addEventListener('orientationchange', function(){
                setTimeout(clampPanoramaFov, 400);
                setTimeout(clampPanoramaFov, 1000);
            });

            /* Re-apply HFOV setiap kali user pindah ke panorama lain (klik hotspot
               atau tombol next). Player TDV reset HFOV ke nilai default tiap
               kali panorama berubah. */
            /* Bind clampPanoramaFov ke event change playlist supaya HFOV
               tetap terkunci saat user pindah panorama. Idempotent via
               flag __hfovBound. */
            function bindPanoramaChange(){
                if(!window.tdvplayer || !window.tdvplayer.getById) return false;
                var mainPL = window.tdvplayer.getById('mainPlayList');
                if(!mainPL || mainPL.__hfovBound) return false;
                try {
                    mainPL.bind('change', function(){
                        setTimeout(clampPanoramaFov, 100);
                        setTimeout(clampPanoramaFov, 500);
                        setTimeout(clampPanoramaFov, 1500);
                    });
                    mainPL.__hfovBound = true;
                    return true;
                } catch(e){ return false; }
            }
            /* ============================================================
               IMG OVERLAY UNTUK DENAH EXPANDED + TOGGLE THUMBNAIL
               (anti-pecah di retina, dengan zoom & pan custom)
               ============================================================
               Canvas TDV merender gambar dengan resolusi rendah & blur,
               plus zoom-nya terbatas. Solusi: inject <img> tag native ke
               dalam container, lalu kita handle pan/zoom sendiri.

               Mobile <=768px: full custom map dengan pan + pinch zoom
               Desktop: idem dengan mouse drag + wheel zoom

               Berlaku DI SEMUA LAYAR (mobile + desktop) supaya konsisten.
               ============================================================ */
            /* Inject <img> overlay native untuk denah Tamansari supaya
               anti-pecah di retina (canvas TDV resolusinya rendah). Setup
               wrapper dengan custom pan + zoom handler. */
            function ensureMapImgOverlay(){
                /* 1. Modal MapViewer expanded -- pakai wrapper untuk pan/zoom */
                var mapViewer = document.getElementById('MapViewer');
                if(mapViewer && !mapViewer.querySelector('.map-img-wrap')){
                    var wrap = document.createElement('div');
                    wrap.className = 'map-img-wrap';

                    var img = document.createElement('img');
                    img.className = 'map-img-overlay';
                    img.src = 'media/map_591F2B0C_46CD_29AA_41AB_C5491D3C7676.jpeg';
                    img.alt = 'Denah Situs Tamansari Yogyakarta';
                    img.decoding = 'async';
                    img.draggable = false;

                    wrap.appendChild(img);
                    mapViewer.appendChild(wrap);

                    /* Setup pan + zoom interaksi */
                    setupMapPanZoom(wrap, img);
                }

                /* 2. Tombol toggle thumbnail di pojok kiri-atas (mobile only).
                      Di desktop biarkan default TDV. */
                if(window.innerWidth <= 768){
                    var toggleBtn = document.getElementById('Image_45E0EBBC_4BCC_8DAB_41D1_1835FA1540D4');
                    if(toggleBtn && !toggleBtn.querySelector('.map-img-overlay')){
                        if(window.getComputedStyle(toggleBtn).position === 'static'){
                            toggleBtn.style.position = 'relative';
                        }
                        var thumb = document.createElement('img');
                        thumb.className = 'map-img-overlay';
                        thumb.src = 'media/map_591F2B0C_46CD_29AA_41AB_C5491D3C7676.jpeg';
                        thumb.alt = 'Toggle denah';
                        thumb.decoding = 'async';
                        thumb.draggable = false;
                        thumb.style.position = 'absolute';
                        thumb.style.inset = '3px';
                        thumb.style.width = 'calc(100% - 6px)';
                        thumb.style.height = 'calc(100% - 6px)';
                        thumb.style.objectFit = 'contain';
                        thumb.style.transform = 'none';
                        thumb.style.left = '3px';
                        thumb.style.top = '3px';
                        thumb.style.pointerEvents = 'none';
                        toggleBtn.appendChild(thumb);
                    }
                } else {
                    /* Desktop: hapus thumbnail overlay jika ada */
                    var toggleBtn = document.getElementById('Image_45E0EBBC_4BCC_8DAB_41D1_1835FA1540D4');
                    if(toggleBtn){
                        var t = toggleBtn.querySelector('.map-img-overlay');
                        if(t) t.remove();
                    }
                }
            }

            /* ============================================================
               PAN + ZOOM HANDLER untuk MapViewer custom
               ============================================================
               Mendukung:
               - Mobile: 1-finger drag = pan, 2-finger pinch = zoom
               - Desktop: mouse drag = pan, scroll wheel = zoom
               - Double-click / double-tap = reset zoom
               Zoom tanpa batas (max 50x).
               ============================================================ */
            /* Pasang handler pan + zoom custom untuk wrapper denah:
               - mouse drag (desktop) / 1-finger drag (mobile) = pan
               - mouse wheel (desktop) / 2-finger pinch (mobile) = zoom
               - dblclick / dbltap = reset fit-contain */
            function setupMapPanZoom(wrap, img){
                if(wrap.__panZoomReady) return;
                wrap.__panZoomReady = true;

                var state = {
                    scale: 1,
                    minScale: 0.2,
                    maxScale: 50,
                    x: 0, y: 0,         /* translate dalam piksel */
                    natW: 0, natH: 0    /* ukuran natural gambar */
                };

                /* Hitung scale awal supaya gambar denah fit-contain di
                   wrapper (tidak terpotong, tidak ada white space berlebih). */
                function fitContain(){
                    var rect = wrap.getBoundingClientRect();
                    if(!rect.width || !rect.height || !state.natW || !state.natH) return;
                    var scaleX = rect.width  / state.natW;
                    var scaleY = rect.height / state.natH;
                    state.scale = Math.min(scaleX, scaleY);
                    /* Center gambar */
                    state.x = -state.natW / 2;
                    state.y = -state.natH / 2;
                    apply();
                }

                /* Apply transform ke <img> berdasarkan state.x/y/scale.
                   transform-origin 0 0 supaya math anchor zoom akurat. */
                function apply(){
                    img.style.transform = 'translate(' + state.x + 'px, ' + state.y + 'px) scale(' + state.scale + ')';
                    img.style.transformOrigin = '0 0';
                    /* Karena img positioned at left:50%, top:50%, transform translate
                       berarti relative ke center wrap. */
                }

                img.addEventListener('load', function(){
                    state.natW = img.naturalWidth;
                    state.natH = img.naturalHeight;
                    fitContain();
                });
                if(img.complete && img.naturalWidth){
                    state.natW = img.naturalWidth;
                    state.natH = img.naturalHeight;
                    fitContain();
                }
                window.addEventListener('resize', function(){
                    /* Re-fit kalau wrap dimensi berubah dan user belum zoom manual */
                    setTimeout(fitContain, 100);
                });

                /* === ZOOM via wheel (desktop) === */
                wrap.addEventListener('wheel', function(e){
                    e.preventDefault();
                    var rect = wrap.getBoundingClientRect();
                    /* Posisi mouse relative ke center wrap (dalam piksel viewport) */
                    var mx = e.clientX - rect.left - rect.width / 2;
                    var my = e.clientY - rect.top  - rect.height / 2;
                    /* Zoom factor (smooth) */
                    var delta = -e.deltaY;
                    var factor = Math.exp(delta * 0.0015);
                    zoomAt(mx, my, factor);
                }, { passive: false });

                /* Zoom in/out di anchor (px,py relatif center wrap),
                   clamp ke minScale/maxScale, recalc translate supaya
                   point di gambar yg ada di anchor tetap di anchor. */
                function zoomAt(px, py, factor){
                    var newScale = state.scale * factor;
                    if(newScale < state.minScale) newScale = state.minScale;
                    if(newScale > state.maxScale) newScale = state.maxScale;
                    var realFactor = newScale / state.scale;
                    /* px,py = posisi anchor relative ke center wrap.
                       state.x, state.y adalah posisi gambar (top-left) relative ke center wrap.
                       Anchor di gambar sebelum zoom: (px - state.x) / state.scale (dalam koord gambar)
                       Setelah zoom dengan scale baru, anchor harus tetap di px,py:
                       state.x_new = px - (px - state.x) * realFactor */
                    state.x = px - (px - state.x) * realFactor;
                    state.y = py - (py - state.y) * realFactor;
                    state.scale = newScale;
                    apply();
                }

                /* === PAN via mouse drag === */
                var dragging = false, dragStartX = 0, dragStartY = 0, origX = 0, origY = 0;

                wrap.addEventListener('mousedown', function(e){
                    e.preventDefault();
                    dragging = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    origX = state.x;
                    origY = state.y;
                    wrap.classList.add('grabbing');
                });
                window.addEventListener('mousemove', function(e){
                    if(!dragging) return;
                    state.x = origX + (e.clientX - dragStartX);
                    state.y = origY + (e.clientY - dragStartY);
                    apply();
                });
                window.addEventListener('mouseup', function(){
                    if(dragging){
                        dragging = false;
                        wrap.classList.remove('grabbing');
                    }
                });

                /* === Double-click reset === */
                wrap.addEventListener('dblclick', function(e){
                    e.preventDefault();
                    fitContain();
                });

                /* === TOUCH: pan (1 finger) + pinch (2 fingers) === */
                var touchState = null;

                wrap.addEventListener('touchstart', function(e){
                    if(e.touches.length === 1){
                        touchState = {
                            mode: 'pan',
                            startX: e.touches[0].clientX,
                            startY: e.touches[0].clientY,
                            origX:  state.x,
                            origY:  state.y
                        };
                    } else if(e.touches.length === 2){
                        var t1 = e.touches[0], t2 = e.touches[1];
                        var dx = t2.clientX - t1.clientX;
                        var dy = t2.clientY - t1.clientY;
                        var startDist = Math.sqrt(dx*dx + dy*dy);
                        var rect = wrap.getBoundingClientRect();
                        var midX = (t1.clientX + t2.clientX) / 2 - rect.left - rect.width / 2;
                        var midY = (t1.clientY + t2.clientY) / 2 - rect.top  - rect.height / 2;
                        touchState = {
                            mode: 'pinch',
                            startDist: startDist,
                            startScale: state.scale,
                            origX: state.x,
                            origY: state.y,
                            anchorX: midX,
                            anchorY: midY,
                            midStartX: (t1.clientX + t2.clientX) / 2,
                            midStartY: (t1.clientY + t2.clientY) / 2
                        };
                    }
                }, { passive: false });

                wrap.addEventListener('touchmove', function(e){
                    if(!touchState) return;
                    e.preventDefault();
                    if(touchState.mode === 'pan' && e.touches.length === 1){
                        state.x = touchState.origX + (e.touches[0].clientX - touchState.startX);
                        state.y = touchState.origY + (e.touches[0].clientY - touchState.startY);
                        apply();
                    } else if(touchState.mode === 'pinch' && e.touches.length === 2){
                        var t1 = e.touches[0], t2 = e.touches[1];
                        var dx = t2.clientX - t1.clientX;
                        var dy = t2.clientY - t1.clientY;
                        var dist = Math.sqrt(dx*dx + dy*dy);
                        var newScale = touchState.startScale * (dist / touchState.startDist);
                        if(newScale < state.minScale) newScale = state.minScale;
                        if(newScale > state.maxScale) newScale = state.maxScale;
                        var realFactor = newScale / touchState.startScale;
                        /* Pinch anchor = midpoint awal pinch */
                        var ax = touchState.anchorX;
                        var ay = touchState.anchorY;
                        state.x = ax - (ax - touchState.origX) * realFactor;
                        state.y = ay - (ay - touchState.origY) * realFactor;
                        state.scale = newScale;
                        /* Tambahkan translasi midpoint shift agar pan + pinch sekaligus */
                        var rect = wrap.getBoundingClientRect();
                        var midX = (t1.clientX + t2.clientX) / 2;
                        var midY = (t1.clientY + t2.clientY) / 2;
                        state.x += (midX - touchState.midStartX);
                        state.y += (midY - touchState.midStartY);
                        apply();
                    }
                }, { passive: false });

                wrap.addEventListener('touchend', function(e){
                    if(e.touches.length === 0){
                        touchState = null;
                    } else if(e.touches.length === 1 && touchState && touchState.mode === 'pinch'){
                        /* Switch dari pinch ke pan */
                        touchState = {
                            mode: 'pan',
                            startX: e.touches[0].clientX,
                            startY: e.touches[0].clientY,
                            origX: state.x,
                            origY: state.y
                        };
                    }
                });

                /* Double tap reset */
                var lastTap = 0;
                wrap.addEventListener('touchend', function(e){
                    if(e.changedTouches.length !== 1) return;
                    var now = Date.now();
                    if(now - lastTap < 320){
                        fitContain();
                        lastTap = 0;
                    } else {
                        lastTap = now;
                    }
                });
            }

            window.addEventListener('tourLoaded', ensureMapImgOverlay);
            window.addEventListener('message', function(e){
                if(e && e.data === 'tourLoaded') setTimeout(ensureMapImgOverlay, 200);
            });
            setTimeout(ensureMapImgOverlay, 1500);
            setTimeout(ensureMapImgOverlay, 4000);
            setTimeout(ensureMapImgOverlay, 8000);

            /* Re-check tiap user klik / resize */
            document.addEventListener('click', function(){
                setTimeout(ensureMapImgOverlay, 100);
            }, true);
            window.addEventListener('resize', function(){
                clearTimeout(window.__mapImgT);
                window.__mapImgT = setTimeout(ensureMapImgOverlay, 200);
            });
            window.addEventListener('orientationchange', function(){
                setTimeout(ensureMapImgOverlay, 400);
            });

            /* ============================================================
               FIX FONT SIZE POPUP INFO BANGUNAN DI MOBILE
               ============================================================
               Player TDV menulis font-size pakai unit "vw" (viewport width)
               yang di HP layar 360px = ~3px (tidak terbaca).

               Strategi: scan SEMUA element (span, div, p) di dalam #viewer,
               kalau punya inline style font-size dengan unit vw, REPLACE
               unit dengan pixel readable. Plus paksa font-size pada
               container HTMLText.
               ============================================================ */
            /* Paksa font-size minimum di popup info bangunan saat mobile.
               TDV pakai unit vw yg jadi terlalu kecil di HP <380px (~3px). */
            function fixPopupFontSize(){
                if(window.innerWidth > 768) return;
                var viewer = document.getElementById('viewer');
                if(!viewer) return;

                var w = window.innerWidth;
                var bodyPx    = w <= 360 ? 13 : (w <= 480 ? 13.5 : 14);
                var headingPx = w <= 360 ? 15 : (w <= 480 ? 15.5 : 16);
                var jumboPx   = w <= 360 ? 16 : (w <= 480 ? 17 : 18);

                /* 1. Scan SEMUA descendant element -- termasuk yang nested */
                var allElements = viewer.getElementsByTagName('*');
                for(var i = 0; i < allElements.length; i++){
                    var el = allElements[i];
                    if(!el.style) continue;
                    var inline = el.getAttribute('style');
                    if(!inline) continue;

                    var changed = false;

                    /* Match font-size dgn unit vw atau vmin */
                    var fsMatch = inline.match(/font-size\s*:\s*([\d.]+)\s*(vw|vmin|vmax)/i);
                    if(fsMatch){
                        var val = parseFloat(fsMatch[1]);
                        var px;
                        if(val <= 1.5)      px = bodyPx;
                        else if(val <= 2.5) px = headingPx;
                        else if(val <= 5)   px = jumboPx;
                        else                px = Math.min(22, val * 4);

                        /* DIRECT INLINE STYLE REPLACEMENT -- replace di attribute,
                           bukan setProperty, agar player TDV tidak bisa override.
                           Ini menulis langsung ke inline style attribute. */
                        var newStyle = inline.replace(
                            /font-size\s*:\s*[\d.]+\s*(vw|vmin|vmax)/gi,
                            'font-size:' + px + 'px'
                        );
                        /* Tambahkan !important via setProperty juga */
                        el.setAttribute('style', newStyle);
                        el.style.setProperty('font-size', px + 'px', 'important');
                        el.style.setProperty('line-height', '1.55', 'important');
                        changed = true;
                    }

                    /* Letter-spacing dengan vw juga harus di-reset */
                    if(/letter-spacing\s*:\s*[\d.]+\s*(vw|vmin)/i.test(inline)){
                        el.style.setProperty('letter-spacing', 'normal', 'important');
                    }

                    /* Line-height dengan vmin juga -- biar tidak collapse */
                    if(/line-height\s*:\s*[\d.]+\s*(vw|vmin)/i.test(inline)){
                        el.style.setProperty('line-height', '1.55', 'important');
                    }
                }

                /* 2. Force font-size di SEMUA HTMLText container + children
                      walaupun tidak ada inline style vw (defensive). */
                var htmlTexts = viewer.querySelectorAll('[id^="htmlText_"], [id^="HTMLText_"], [id*="-HTMLText"]');
                htmlTexts.forEach(function(container){
                    /* Container itself */
                    container.style.setProperty('padding', '14px 18px', 'important');
                    container.style.setProperty('box-sizing', 'border-box', 'important');
                    container.style.setProperty('width', '100%', 'important');

                    /* All descendants */
                    var children = container.getElementsByTagName('*');
                    for(var j = 0; j < children.length; j++){
                        var c = children[j];
                        if(!c.style) continue;
                        var cs = window.getComputedStyle(c);
                        var fz = parseFloat(cs.fontSize);
                        if(!fz || fz < 12){
                            c.style.setProperty('font-size', bodyPx + 'px', 'important');
                            c.style.setProperty('line-height', '1.55', 'important');
                            c.style.setProperty('letter-spacing', 'normal', 'important');
                        }
                    }
                });

                /* 3. DEFENSIVE: scan SEMUA element di viewer untuk computed
                      font-size sangat kecil (< 10px) -- paksa jadi readable */
                for(var i = 0; i < allElements.length; i++){
                    var el = allElements[i];
                    if(!el.style) continue;
                    /* Skip element yg sudah kita touch via inline replace */
                    if(el.tagName === 'CANVAS' || el.tagName === 'IMG' || el.tagName === 'IMAGE') continue;
                    var cs = window.getComputedStyle(el);
                    var fz = parseFloat(cs.fontSize);
                    if(fz && fz < 10 && el.textContent && el.textContent.trim().length > 0){
                        el.style.setProperty('font-size', bodyPx + 'px', 'important');
                        el.style.setProperty('line-height', '1.55', 'important');
                    }
                }
            }

            window.addEventListener('tourLoaded', fixPopupFontSize);
            window.addEventListener('message', function(e){
                if(e && e.data === 'tourLoaded') setTimeout(fixPopupFontSize, 200);
            });
            setTimeout(fixPopupFontSize, 1500);
            setTimeout(fixPopupFontSize, 4000);
            setTimeout(fixPopupFontSize, 8000);

            /* Re-apply tiap user klik (untuk popup yg muncul on-demand) */
            document.addEventListener('click', function(){
                setTimeout(fixPopupFontSize, 50);
                setTimeout(fixPopupFontSize, 300);
                setTimeout(fixPopupFontSize, 800);
            }, true);
            document.addEventListener('touchend', function(){
                setTimeout(fixPopupFontSize, 50);
                setTimeout(fixPopupFontSize, 300);
                setTimeout(fixPopupFontSize, 800);
            }, true);

            /* MutationObserver agar font tetap fix kalau player render
               popup baru / re-write style */
            if(typeof MutationObserver !== 'undefined'){
                setTimeout(function(){
                    var viewer = document.getElementById('viewer');
                    if(!viewer) return;
                    var fixDebounce;
                    var obs = new MutationObserver(function(mutations){
                        if(window.innerWidth > 768) return;
                        clearTimeout(fixDebounce);
                        fixDebounce = setTimeout(fixPopupFontSize, 80);
                    });
                    obs.observe(viewer, {
                        childList: true,
                        subtree: true,
                        attributes: true,
                        attributeFilter: ['style']
                    });
                }, 2500);
            }
        })();
    </script>
    <script>
        /* ============================================================
           CUSTOM DENAH OVERLAY (CARA B) -- TOGGLE
           Removed: kembali ke denah bawaan TDV.
           ============================================================ */
    </script>

    <script>
        /* ============================================================
           CENTERING ENFORCER UNTUK PANEL KONTROL BAWAH (DESKTOP)
           ============================================================
           Di desktop kita tidak set width JS-side. Centering via CSS
           media query (left:50% + transform:translateX(-50%)). JS
           enforcer ini memastikan inline style mobile (left/right/
           transform yg ditulis TDV API saat mobile pass) dibersihkan
           saat user resize ke desktop, sehingga CSS take over.

           Di mobile (<=768px) kita TIDAK menyentuh inline style sini --
           biarkan applyMobileOverrides yang handle.
           ============================================================ */
        (function(){
            var PANEL_ID = 'Container_3F72EA07_2713_E8A1_41C0_5D817AC45A95';

            /* Helper: cek apakah viewport saat ini desktop (>768px). */
            function isDesktop(){ return window.innerWidth > 768; }

            /* DESKTOP only: hapus inline style positioning sisa mobile,
               lalu re-set left:50% + transform:translateX(-50%) dengan
               !important. Skip kalau mobile (di-handle TDV API). */
            function cleanInlineForDesktop(){
                if(!isDesktop()) return;
                var panel = document.getElementById(PANEL_ID);
                if(!panel) return;
                /* Bersihkan dulu sisa mobile */
                panel.style.removeProperty('left');
                panel.style.removeProperty('right');
                panel.style.removeProperty('transform');
                /* Lalu set ulang dengan !important agar tahan terhadap
                   inline write berikutnya dari TDV. */
                panel.style.setProperty('right', 'auto', 'important');
                panel.style.setProperty('left', '50%', 'important');
                panel.style.setProperty('transform', 'translateX(-50%)', 'important');
                panel.style.setProperty('transform-origin', 'bottom center', 'important');
            }

            /* Trigger cleanInlineForDesktop berkala via setInterval supaya
               TDV inline writes pada panel kontrol selalu di-bersihkan. */
            function startEnforce(){
                cleanInlineForDesktop();
                var n = 0;
                var t = setInterval(function(){
                    cleanInlineForDesktop();
                    if(++n > 12) clearInterval(t);
                }, 250);
            }

            window.addEventListener('tourLoaded', startEnforce);
            window.addEventListener('message', function(e){
                if(e && e.data === 'tourLoaded') startEnforce();
            });
            setTimeout(startEnforce, 1500);
            setTimeout(startEnforce, 4000);

            /* Resize: deteksi transisi mobile<->desktop */
            var lastIsDesktop = isDesktop();
            var debounce;
            window.addEventListener('resize', function(){
                clearTimeout(debounce);
                debounce = setTimeout(function(){
                    var nowDesktop = isDesktop();
                    if(nowDesktop && !lastIsDesktop){
                        /* Baru saja transisi mobile -> desktop. Beberapa
                           retry karena TDV juga melakukan re-layout sendiri. */
                        cleanInlineForDesktop();
                        setTimeout(cleanInlineForDesktop, 100);
                        setTimeout(cleanInlineForDesktop, 400);
                        setTimeout(cleanInlineForDesktop, 900);
                    } else if(nowDesktop){
                        cleanInlineForDesktop();
                    }
                    lastIsDesktop = nowDesktop;
                }, 80);
            });
            window.addEventListener('orientationchange', function(){
                setTimeout(function(){
                    if(isDesktop()) cleanInlineForDesktop();
                }, 200);
            });

            /* Observer: setiap kali TDV menulis ulang inline style
               saat di desktop, bersihkan & re-apply centering. */
            /* Pasang MutationObserver pada attribute style panel.
               Setiap kali TDV menulis ulang style inline saat di desktop,
               langsung re-clean & re-apply centering. Idempotent. */
            function attachObserver(){
                var panel = document.getElementById(PANEL_ID);
                if(!panel || panel.__deskCenterObserved) return false;
                try {
                    var obs = new MutationObserver(function(){
                        if(!isDesktop()) return;
                        /* Hindari loop tak berhingga: cek apakah style sudah benar */
                        if(panel.style.left !== '50%' || panel.style.transform.indexOf('translateX(-50%)') === -1){
                            cleanInlineForDesktop();
                        }
                    });
                    obs.observe(panel, { attributes: true, attributeFilter: ['style'] });
                    panel.__deskCenterObserved = true;
                    return true;
                } catch(e){ return false; }
            }
            (function tryObserve(){
                if(attachObserver()) return;
                setTimeout(tryObserve, 600);
            })();
        })();
    </script>

    <script>
        /* ============================================================
           DISABLE AUTO-ROTATE / AUTO PLAY (CAMERA MOVEMENT)
           ============================================================
           Penyebab kamera bergerak otomatis & tombol play/fast-forward
           tampak "tertekan":

           - PanoramaPlayer berada di state 'playing'. Saat playing,
             player TDV menjalankan camera sequence (initialSequence /
             idleSequence) sehingga panorama berputar otomatis dan
             panel tombol menampilkan tombol Play & Fast-Forward dalam
             keadaan pressed (merah).

           Solusi resmi TDV: panggil `pauseCamera()` pada setiap
           PanoramaPlayer. State berubah ke 'paused' -> sequence
           berhenti, tombol play/fast-forward kembali normal.

           Strategi:
           1. Saat tour load, panggil `pauseCamera()` pada semua
              PanoramaPlayer.
           2. Bind ke `stateChange` event setiap player. Jika player
              masuk state 'playing' karena event apapun (auto-resume,
              hotspot click yg auto-play, dsb.) langsung pause kembali.
           3. `timeToIdle` di-set besar -> idleSequence tidak pernah
              dipicu (auto-rotate setelah idle).
           4. Re-apply pada perubahan playlist & event 'begin' tiap
              PanoramaPlayListItem.
           ============================================================ */
        (function(){
            var INFINITE_IDLE = 1e12;

            /* Set timeToIdle ke 1e12 ms (~32 tahun) supaya idleSequence
               (auto-rotate setelah idle) praktis tidak akan trigger. */
            function setInfiniteIdle(){
                if(!window.tdvplayer || !window.tdvplayer.getByClassName) return;
                try {
                    var cameras = window.tdvplayer.getByClassName('PanoramaCamera') || [];
                    cameras.forEach(function(cam){
                        try { cam.set('timeToIdle', INFINITE_IDLE); } catch(e){}
                    });
                } catch(e){}
            }

            /* Panggil pauseCamera() di setiap PanoramaPlayer -- API resmi
               TDV untuk menghentikan animasi camera (initialSequence /
               idleSequence). State player jadi 'paused'. */
            function pauseAllPanoramaPlayers(){
                if(!window.tdvplayer || !window.tdvplayer.getByClassName) return;
                try {
                    var players = window.tdvplayer.getByClassName('PanoramaPlayer') || [];
                    players.forEach(function(p){
                        try {
                            if(typeof p.pauseCamera === 'function'){
                                p.pauseCamera();
                            }
                        } catch(e){}
                    });
                } catch(e){}
            }

            /* Lock-back: tiap kali player coba kembali ke state 'playing',
               langsung pause lagi. Ini memastikan tidak ada kondisi di mana
               TDV otomatis resume camera sequence. */
            /* Bind 'stateChange' ke setiap PanoramaPlayer. Kalau state
               berubah ke 'playing' (misal: hotspot click yg auto-play),
               langsung pauseCamera() lagi -- player terkunci di paused. */
            function bindPlayerStateChange(){
                if(!window.tdvplayer || !window.tdvplayer.getByClassName) return false;
                var bound = 0;
                try {
                    var players = window.tdvplayer.getByClassName('PanoramaPlayer') || [];
                    players.forEach(function(p){
                        if(p.__noAutoRotateBound) return;
                        try {
                            p.bind('stateChange', function(){
                                try {
                                    if(p.get && p.get('state') === 'playing'){
                                        if(typeof p.pauseCamera === 'function'){
                                            p.pauseCamera();
                                        }
                                    }
                                } catch(e){}
                            }, p);
                            p.__noAutoRotateBound = true;
                            bound++;
                        } catch(e){}
                    });
                } catch(e){}
                return bound > 0;
            }

            /* Combo: setInfiniteIdle + pauseAllPanoramaPlayers +
               bindPlayerStateChange. Dipakai sebagai "kill switch"
               untuk auto-rotate. */
            function applyDisable(){
                setInfiniteIdle();
                pauseAllPanoramaPlayers();
                bindPlayerStateChange();
            }

            /* Initial apply setelah tour load */
            window.addEventListener('tourLoaded', function(){
                setTimeout(applyDisable, 100);
                /* Beberapa retry karena initialSequence biasanya mulai
                   100-500ms setelah panorama begin */
                setTimeout(pauseAllPanoramaPlayers, 400);
                setTimeout(pauseAllPanoramaPlayers, 900);
                setTimeout(pauseAllPanoramaPlayers, 1800);
            });
            window.addEventListener('message', function(e){
                if(e && e.data === 'tourLoaded'){
                    setTimeout(applyDisable, 100);
                    setTimeout(pauseAllPanoramaPlayers, 400);
                    setTimeout(pauseAllPanoramaPlayers, 900);
                    setTimeout(pauseAllPanoramaPlayers, 1800);
                }
            });
            /* Fallback bila event tourLoaded tidak terbit */
            setTimeout(applyDisable, 2500);
            setTimeout(applyDisable, 5000);

            /* Bind playlist 'change' event supaya saat user pindah
               panorama, applyDisable() di-trigger lagi (TDV bisa reset
               player state pada panorama baru). */
            function bindPlaylistChange(){
                if(!window.tdvplayer || !window.tdvplayer.getById) return false;
                var mainPL = window.tdvplayer.getById('mainPlayList');
                if(!mainPL || mainPL.__autoRotateBound) return false;
                try {
                    mainPL.bind('change', function(){
                        setInfiniteIdle();
                        bindPlayerStateChange();
                        /* Beberapa retry */
                        setTimeout(pauseAllPanoramaPlayers, 80);
                        setTimeout(pauseAllPanoramaPlayers, 350);
                        setTimeout(pauseAllPanoramaPlayers, 900);
                        setTimeout(pauseAllPanoramaPlayers, 1800);
                    });
                    mainPL.__autoRotateBound = true;
                    return true;
                } catch(e){ return false; }
            }
            (function tryBind(){
                if(bindPlaylistChange()) return;
                setTimeout(tryBind, 600);
            })();

            /* Bind 'begin' ke setiap PanoramaPlayListItem -- lebih reliable
               ketimbang playlist 'change' karena 'begin' dipanggil tepat
               saat panorama mulai render. */
            /* Bind 'begin' ke setiap PanoramaPlayListItem. Lebih reliable
               ketimbang playlist 'change' karena 'begin' fire tepat saat
               panorama baru mulai render. */
            function bindAllBegins(){
                if(!window.tdvplayer || !window.tdvplayer.bindOnObjectsOf) return false;
                if(window.__beginBoundForAutoRotate) return true;
                try {
                    window.tdvplayer.bindOnObjectsOf('PanoramaPlayListItem', 'begin', function(){
                        setInfiniteIdle();
                        bindPlayerStateChange();
                        setTimeout(pauseAllPanoramaPlayers, 60);
                        setTimeout(pauseAllPanoramaPlayers, 300);
                        setTimeout(pauseAllPanoramaPlayers, 800);
                    }, window.tdvplayer);
                    window.__beginBoundForAutoRotate = true;
                    return true;
                } catch(e){ return false; }
            }
            (function tryBindBegins(){
                if(bindAllBegins()) return;
                setTimeout(tryBindBegins, 600);
            })();
        })();
    </script>
